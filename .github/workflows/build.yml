name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Maven package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build without tests
        run: mvn -B -DskipTests package

  test:
    name: Maven tests with required services
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Start infrastructure services
        run: docker compose -f docker-compose-infrastructure-services.yml up -d

      - name: Wait for infrastructure ports
        run: |
          for port in 3306 5432 6379 9092; do
            for attempt in {1..60}; do
              if (echo > "/dev/tcp/127.0.0.1/$port") >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "Port $port did not become available"
                docker compose -f docker-compose-infrastructure-services.yml ps
                exit 1
              fi
              sleep 2
            done
          done

      - name: Start config-server for config-dependent tests
        run: |
          nohup mvn -B -pl config-server spring-boot:run \
            -Dspring-boot.run.arguments="--spring.cloud.config.server.native.searchLocations=file:$GITHUB_WORKSPACE/config-files" \
            > "$RUNNER_TEMP/config-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/config-server.pid"

      - name: Wait for config-server
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8888/config-server/account-api/default > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/config-server.log"
          exit 1

      - name: Run tests
        run: mvn -B test

      - name: Collect config-server log
        if: always()
        run: cat "$RUNNER_TEMP/config-server.log" || true

      - name: Stop local services
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/config-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/config-server.pid")" || true
          fi
          docker compose -f docker-compose-infrastructure-services.yml down
